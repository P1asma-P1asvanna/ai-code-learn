# ตรวจโค้ดอัตโนมัติทุกครั้งที่ push — ดูผลที่แท็บ Actions ของ repo (ไม่ต้องรันอะไรในเครื่อง)
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: ailearn
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      APP_ENV: dev
      DATABASE_URL: postgresql://app:app@localhost:5432/ailearn
      JWT_SECRET: ci-only-secret-ci-only-secret-ci-only-1234
      AUTO_CREATE_TABLES: "true"
      AUTO_SEED: "true"
      # ค่าปลอม — เทสต์จำลองการตอบของ AI เอง ไม่ได้เรียก provider จริง
      AI_API_KEY: ci-fake-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -v

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      - run: npm run build
